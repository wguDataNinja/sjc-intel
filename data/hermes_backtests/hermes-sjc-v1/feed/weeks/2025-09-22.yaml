  title: SJCSD Begins Community Engagement for Naming and Mascot Selection of Schools
    QQ and RR
  summary: 'St. Johns County School District initiated community engagement for the
    naming and mascot selection of two new K-8 schools: School QQ in Silverleaf and
    School RR in Nocatee. Virtual meetings were held to gather input from residents
    on school names and mascots for the schools projected to open for the 2026-2027
    school year.'
