  title: Here's your first look at SilverLeaf's new 55,000 sq. ft. mega Publix
  summary: A massive new Publix — one of the chain's largest at 55,701 sq. ft. — has
    opened at 1975 SilverLeaf Parkway, giving SilverLeaf residents a full-service
    grocery with specialty departments including a Pours café serving beer and wine,
    a scratch bakery, custom-cut meats, fresh seafood, a full-service pharmacy, and
    prepared food stations.
