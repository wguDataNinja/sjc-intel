  source_id: sjcsd_main_site
  source_name: sjcsd_main_site
  title: Hallowes Cove Academy Opens as St. Johns County's Newest K-8 School for 2025-2026
  summary: Hallowes Cove Academy, St. Johns County School District's newest K-8 school,
    opened its doors for the 2025-2026 school year. The school, led by Principal Jessley
    Hathaway and featuring the Hurricanes mascot, serves students in grades K-8 with
    extended day programs. The school's dedicated website and branding materials were
    finalized in April 2025 ahead of the August opening.
  source_published_at: '2025-08-11'
