  source_name: sjcsd_news
  title: SJCSD Releases Revised Attendance Zoning Proposal Following Community Feedback
  summary: St. Johns County School District released a revised attendance zoning proposal
    after receiving community input on initial boundary recommendations. The revised
    proposal addresses concerns from affected neighborhoods and adjusts proposed zone
    lines for schools serving the Silverleaf and Nocatee growth corridors.
  source_published_at: '2025-08-15'
