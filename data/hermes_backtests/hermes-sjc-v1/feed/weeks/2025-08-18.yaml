  title: County Road 2209 Roadway Expansion Underway in St. Johns County
  summary: St. Johns County commenced construction on a major roadway expansion project
    along County Road 2209, building a new four-lane corridor between Silverleaf Parkway
    and State Road 16 to improve traffic flow in the northern part of the county.
    The project supports long-term mobility needs and upholds the county's obligations
    to FDOT to alleviate traffic challenges on I-95.
  source_published_at: '2025-08-20'
