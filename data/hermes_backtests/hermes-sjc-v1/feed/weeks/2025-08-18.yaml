  title: Marsh Landing Wastewater Plant Receives Major Electrical Upgrade
  summary: St. Johns County moved forward with a critical infrastructure upgrade at
    the Marsh Landing Wastewater Plant in Ponte Vedra. The electrical upgrade project
    supports future growth and resilience, replacing aging electrical systems to improve
    reliability and capacity at the facility.
