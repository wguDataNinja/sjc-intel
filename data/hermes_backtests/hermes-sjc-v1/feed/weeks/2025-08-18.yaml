  title: State Road 16 Widening Project from International Golf Parkway to I-95 Public
    Hearing
  summary: FDOT hosted hybrid public hearings to discuss the proposed State Road 16
    widening project from International Golf Parkway to I-95. A virtual public hearing
    was held Aug. 26, 2025 and an in-person hearing on Aug. 28, 2025 at the World
    Golf Village Renaissance, with registration available at nflroads.com.
