  title: SJCSD Presents Final Attendance Zoning Plans for 2025-2026 School Year
  summary: St. Johns County School District presented final attendance zoning plans
    establishing school attendance boundaries for the 2025-2026 school year. The plans
    incorporate adjustments for the opening of Hallowes Cove Academy and address capacity
    needs across the district's growing areas including Silverleaf and Nocatee.
