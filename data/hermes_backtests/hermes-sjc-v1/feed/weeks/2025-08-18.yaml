  title: St. Johns County Appoints New Office of Management & Budget Director
  summary: St. Johns County appointed Wade Schroeder as the new Office of Management
    & Budget Director. Schroeder had served as the OMB Assistant Director since 2016.
    The appointment was made during the Aug. 19, 2025 Board of County Commissioners
    Regular Meeting.
