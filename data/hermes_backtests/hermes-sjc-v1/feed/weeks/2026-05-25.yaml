  week_date: 2026-05-26
  source_id: sjc_county_news
  source_name: St. Johns County
  title: SJC Highlights Long-Term Resiliency Improvements at Porpoise Point Vehicular
    Beach Access Ramp
  summary: 'St. Johns County completed approximately $524,000 in resiliency improvements
    at the Porpoise Point Vehicular Beach Access Ramp in Vilano Beach. The project
    added a paved access point, upgraded gate infrastructure, and a concrete-encapsulated
    seawall to improve flood mitigation and coastal resiliency.

    '
