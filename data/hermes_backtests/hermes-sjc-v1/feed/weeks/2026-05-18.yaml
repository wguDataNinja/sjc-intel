- item_id: SJC-SJSO-20260603-0001
  week_date: 2026-05-21
  source_id: sjso_news_stories
  source_name: St. Johns County Sheriff's Office
  title: St. Johns County inmate charged; woman arrested for executing a contraband
    drop on restricted law enforcement property
  summary: 'SJSO inmate Devin Delaney and his girlfriend Jacqueline Mottor, both 20,
    were charged after planning a contraband drop of nicotine products onto restricted
    SJSO property. Deputies found Delaney with 14 nicotine pouches; Mottor was arrested
    for introduction of contraband and trespassing.

    '
  source_published_at: '2026-05-21T12:00:00Z'
