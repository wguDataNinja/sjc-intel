  source_name: St. Johns County School District
  title: Community Support for SJCSD Half-Cent Sales Surtax and One Mill Confirmed
  summary: 'St. Johns County voters approved continuing the half-cent sales surtax
    for school capital outlay and adding one mill of operating millage to preserve
    educational programs during the November 2024 election. Impact continues into
    2026.

    '
