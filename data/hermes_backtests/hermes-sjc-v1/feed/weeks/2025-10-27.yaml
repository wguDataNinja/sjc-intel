  title: 'Road relief: Here''s your first look at St. Johns County''s newest highway'
  summary: County Road 2209 opened October 28, 2025, connecting International Golf
    Parkway to SilverLeaf Parkway with a four-lane divided roadway spanning three
    miles. The new route aims to relieve congestion in the rapidly growing area, particularly
    around Tocoi Creek High School which serves over 2,700 students.
