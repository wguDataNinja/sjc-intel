  source_name: St. Johns County
  title: St. Johns County Enters Phase III Extreme Water Shortage Declaration
  summary: 'The St. Johns River Water Management District issued a Phase III Extreme
    Water Shortage Declaration affecting St. Johns and six other counties due to Extreme
    Drought (D3) conditions — the most severe level recorded in Florida since 2000.
    Mandatory water restrictions limit landscape irrigation to one day per week.

    '
  source_published_at: '2026-05-13T12:00:00Z'
