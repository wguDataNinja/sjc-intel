  title: SJCSD School Board Reviews Enrollment Data and Capacity Needs for Growing
    Areas
  summary: St. Johns County School District board members reviewed fall enrollment
    data and capacity utilization across the district during the first month of the
    2025-2026 school year. The review informed planning for attendance zone adjustments
    and future school construction priorities, particularly in the Silverleaf and
    Nocatee corridors where enrollment continues to outpace projections.
  source_published_at: '2025-09-15'
