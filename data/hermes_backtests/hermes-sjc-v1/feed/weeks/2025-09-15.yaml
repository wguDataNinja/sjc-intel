  title: 'Press Release: SJC Adopts $1.8 Billion FY2026 Budget with Historic Property
    Tax Reduction'
  summary: St. Johns County issued a press release announcing the Board of County
    Commissioners' adoption of the $1.8 billion FY2026 budget, highlighted by the
    first property tax rate reduction since FY2021, historic investments in public
    safety, infrastructure, and quality of life projects.
