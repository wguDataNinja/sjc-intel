  title: SJCSD Provides Construction Update on K-8 Schools QQ and RR in Silverleaf
    and Nocatee
  summary: 'St. Johns County School District provided an update on two new K-8 schools
    under construction: School QQ in the Silverleaf DRI (Parcel 29C) and School RR
    in Nocatee''s Seabrook area (formerly Snowden Village). Both schools have a capacity
    of approximately 1,500 students each and are projected to open for the 2026-2027
    school year.'
  source_published_at: '2025-09-15'
