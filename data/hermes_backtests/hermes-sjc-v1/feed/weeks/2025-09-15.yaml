  title: 'Second Public Hearing: Final FY2026 Budget Adoption and Millage Rate Resolution'
  summary: St. Johns County Board of County Commissioners held the second public hearing
    and final adoption of the FY2026 budget on September 16, 2025 at 5:01 PM, approving
    the $1.8 billion budget with property tax reduction, the first such reduction
    since FY2021.
