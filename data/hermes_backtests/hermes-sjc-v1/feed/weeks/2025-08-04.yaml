  title: Update on Proposed Magic Beach Motel Demolition
  summary: St. Johns County announced it would issue a demolition permit for the Magic
    Beach Motel at 50 Vilano Road in accordance with state law. The property, constructed
    in 1951 and designated in 2021 as a Significant Cultural Resource, is partially
    located seaward of the Coastal Construction Control Line. The county stated it
    was legally prohibited from denying or conditioning demolition.
  source_published_at: '2025-08-05'
