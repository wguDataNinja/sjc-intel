  title: Precautionary Boil Water Notice for Sawmill Lakes in Ponte Vedra
  summary: St. Johns County Utility Department issued a precautionary boil water notice
    for 20 residents on Sawmill Lakes Blvd (addresses 128-179) in Ponte Vedra on August
    7, 2025, due to equipment failure. Residents were notified via door tags. The
    notice required boiling water for one minute before consumption and remained in
    effect until laboratory tests confirmed safe drinking water, typically a minimum
    of two days.
  source_published_at: '2025-08-07'
