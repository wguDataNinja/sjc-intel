  title: Traffic Pattern Shift Scheduled for CR 210 Widening Project on Aug. 15
  summary: St. Johns County announced a traffic pattern shift on County Road 210 as
    part of the ongoing widening project. Beginning the night of Friday, Aug. 15,
    2025, both westbound and eastbound lanes of CR 210 were transitioned from the
    existing roadway to newly constructed roadway just east of Stone Creek Circle,
    returning to the existing roadway at the intersection with Cimarrone Boulevard.
  source_published_at: '2025-08-09'
