  title: 'Inside SJC Episode 5: Notifying Residents Using Alert St. Johns Emergency
    Notification System'
  summary: St. Johns County launched Inside SJC Episode 5, highlighting how the county
    notifies residents in real-time about possible threats to public safety using
    Alert St. Johns — covering severe weather, unexpected road closures, water advisories,
    missing persons, or evacuations. The episode educates residents on how to sign
    up for emergency alerts.
  source_published_at: '2025-08-05'
