  title: 'Nailed it: St. Johns officials give sneak peek of new Silverleaf K-8 school'
  summary: A new 190,000 sq. ft., three-story K-8 school in SilverLeaf reached its
    structural milestone with a topping-out ceremony. The 73-classroom school will
    serve ~1,500 students when it opens for the 2026–2027 school year, part of a district-wide
    push to alleviate overcrowding — over 13,000 students countywide are currently
    in portable classrooms.
