  title: Fore! Major new 2-acre recreational attraction proposed for SilverLeaf by
    husband and wife team
  summary: Beach Valley Mini Golf, a 36-hole mini-golf course with a clubhouse, pavilions,
    and parking, has been proposed on 2 acres in SilverLeaf. The husband-and-wife
    developer team Michael and Bridgette Goolsby would lease the land from The Hutson
    Companies, pending county Development Review Committee approval.
