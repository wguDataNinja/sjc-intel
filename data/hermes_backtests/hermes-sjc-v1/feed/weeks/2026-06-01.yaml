  source_id: st_johns_citizen
  source_name: St. Johns Citizen
  title: 'Exclusive: Here''s what coming to new Nocatee retail center across from
    water park'
  summary: An Ascension St. Vincent's primary care center is planned for a six-storefront
    commercial strip along Crosswater Parkway in Nocatee, directly across from Splash
    Water Park. The center will occupy three of the six units, providing adult and
    pediatric care including physicals, screenings, and treatment for minor illnesses
    and injuries.
