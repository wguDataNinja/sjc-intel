  title: County Celebrates Start of SR 16 and International Golf Parkway Improvements
    Project with Groundbreaking Ceremony
  summary: St. Johns County officials held a groundbreaking ceremony at the intersection
    of SR 16 and International Golf Parkway on Aug. 25, 2025 to celebrate the start
    of improvements to the intersection. The $25 million project, led by SJC Public
    Works, will expand SR 16 from two lanes to four lanes, including drainage upgrades,
    sidewalks, and a traffic signal.
  source_published_at: '2025-08-29'
