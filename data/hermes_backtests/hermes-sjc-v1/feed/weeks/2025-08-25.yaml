  title: SJC Coastal Management to Present on Shore Protection Project Easements
  summary: St. Johns County Coastal Management staff presented to the City of St.
    Augustine Beach Commission on Sept. 4, 2025 regarding perpetual easements necessary
    for the continuation of the St. Johns County Shore Protection Project — a long-standing
    partnership between the county and U.S. Army Corps of Engineers providing vital
    beach nourishment to protect coastal infrastructure, properties, and habitats.
