  title: Hallowes Cove Academy Welcomes First Students for Inaugural School Year
  summary: Hallowes Cove Academy, St. Johns County School District's newest K-8 school,
    welcomed its first cohort of students for the 2025-2026 school year in September.
    Led by Principal Jessley Hathaway with the Hurricanes mascot, the school serves
    grades K-8 with extended day programs in the Silverleaf area.
