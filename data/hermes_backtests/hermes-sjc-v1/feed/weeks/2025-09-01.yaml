  title: Notice of Intent to Apply for CDBG-DR Grant Funds (2023/2024 Storms)
  summary: St. Johns County published a notice of intent to apply for Community Development
    Block Grant-Disaster Recovery (CDBG-DR) funds through the Rebuild Florida 2023/2024
    Storms Infrastructure Repair Program, with up to $400 million available for infrastructure
    repairs following recent storm events.
