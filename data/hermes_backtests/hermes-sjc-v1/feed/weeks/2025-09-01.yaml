  title: 'First Public Hearing: FY2026 Tentative Budget and Proposed Millage Rates'
  summary: St. Johns County Board of County Commissioners held the first of two required
    public hearings on September 3, 2025 at 5:01 PM to present the tentative FY2026
    budget of $1.8 billion and proposed millage rates, including the first property
    tax rate reduction since FY2021.
