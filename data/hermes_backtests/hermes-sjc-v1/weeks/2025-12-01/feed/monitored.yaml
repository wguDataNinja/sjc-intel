  title: St. Johns County is getting two new supermarkets — and they're not Publix
  summary: Two 61,000 sq. ft. supermarkets from a Kroger-owned chain (identified as
    Harris Teeter) are proposed for St. Johns County — one at Veterans Parkway and
    CR 210 West and another in a SilverLeaf shopping center. The applications represent
    the first major non-Publix grocery competition in the area.
