- item_id: SJC-SL-20260809-0005
  title: Courtney Vista Drive improvements complete — new direct link between CR 2209
    and Silverleaf Parkway
  summary: St. Johns County completed Courtney Vista Drive improvements in about nine
    months, ahead of the projected 12-month timeline, creating a more direct route
    between County Road 2209 and Silverleaf Parkway and supporting safe access to
    the newly opened Magnolia Oaks Academy. The county encourages traffic awareness
    as the school year begins.
