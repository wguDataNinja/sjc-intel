- item_id: SJC-SL-20260809-0006
  title: SR 16 RCUT intersection improvements — new traffic patterns at Stratton Boulevard
    and Industry Center Road expected mid-to-late September
  summary: St. Johns County Public Works is finishing FDOT-recommended Restricted
    Crossing U-Turn (RCUT) intersection improvements on SR 16 at Stratton Boulevard
    and Industry Center Road. Signalized U-turns replace unsignalized left turns,
    with additional turn lanes, new signals, and two new pedestrian crosswalks; the
    new traffic pattern is expected to start mid-to-late September.
