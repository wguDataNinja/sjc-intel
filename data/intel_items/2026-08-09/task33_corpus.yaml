- item_id: SJC-SL-20260809-0001
  title: Magnolia Oaks Academy opens Aug. 10 with 1,300 students — K-8 school in Silverleaf
  summary: SJCSD confirms Magnolia Oaks Academy will welcome 1,300 students on its
    first day, Aug. 10, 2026, serving kindergarten through seventh grade in its first
    year. The district opened the doors announcement (July 22, 2026) confirms the
    school is the first in the Silverleaf community. The 2026-27 attendance plan for
    K-8 School QQ (Magnolia Oaks) was approved by the School Board Nov. 18, 2025 and
    the district's attendance-zone locator is live.
