- item_id: SJC-SL-20260809-0003
  title: First Coast Expressway final segment under construction — $205M contract,
    completion late 2030/early 2031
  summary: FDOT's final St. Johns County segment of the First Coast Expressway — from
    I-95 to east of CR 2209 (St. Johns Parkway) — is under construction with a $205
    million contract awarded to Mastec Civil LLC. FDOT lists construction start in
    early 2026 and expected completion in late 2030/early 2031. A hybrid construction
    open house was held Feb. 3, 2026 at World Golf Village.
