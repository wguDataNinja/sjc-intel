    was presented July 21, 2026, proposed millage (ceiling) rates were set, and the
    first public hearing to adopt the FY2027 budget is set for Sept. 3, 2026 at 5:01
    p.m. TRIM notices reflecting proposed property taxes are mailed in mid-August.'
