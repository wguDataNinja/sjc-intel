- item_id: SJC-UTIL-20260603-0001
  title: Phase III Extreme Water Shortage Declaration — Active
  summary: 'SJRWMD Phase III Extreme Water Shortage remains in effect as of June 2026
    due to Extreme Drought (D3). Residential irrigation limited to one day per week,
    prohibited 8 a.m. to 6 p.m. Reclaimed water exempt. This is the most severe water
    shortage declaration since 2000.

    '
  source_id: sjc_utility_department
  source_url: https://www.sjcfl.us/departments/utility-department/
  source_published_at: '2026-05-11'
