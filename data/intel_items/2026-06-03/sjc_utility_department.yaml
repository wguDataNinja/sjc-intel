  raw_excerpt: 'Beginning May 11, 2026, the St. Johns River Water Management District
    (SJRWMD) has issued a Phase III Extreme Water Shortage Declaration. Residential
    landscape irrigation is currently limited to one day per week and is prohibited
    between 8 a.m. and 6 p.m.

    '
  citation:
    source_name: St. Johns County Utility Department
    source_type: government_website
    accessed_at: '2026-06-03T23:30:00Z'
