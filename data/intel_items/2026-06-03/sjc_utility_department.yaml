- item_id: SJC-UTIL-20260603-0002
  title: Free Chlorine Burnout Scheduled June 1–21
  summary: 'The County Road 214 Water Treatment Plant is conducting a free chlorine
    burnout from June 1 to June 21 to enhance water quality. Water remains safe to
    drink. Customers may notice slight discoloration, cloudiness, or chlorine odor.

    '
  source_id: sjc_utility_department
