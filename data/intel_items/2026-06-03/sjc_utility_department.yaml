  resident_relevance:
    summary: 'The most severe water shortage declaration since 2000 remains in effect.
      All SJC residents face mandatory one-day-per-week irrigation limits.

      '
    affected_audiences:
    - residents
    - homeowners
    - business_owners
    why_it_matters: 'Ongoing irrigation restrictions affect all properties with landscaping.
      Reclaimed water users exempt. Violations may result in penalties. Drought conditions
      may lead to higher water costs.

      '
    confidence: high
    inference_notes: 'Restriction details directly from SJRWMD via SJC Utility Department
