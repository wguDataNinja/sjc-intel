  raw_excerpt: 'In November 2025, Charlie Ryan, an autistic juvenile, left his home
    on foot, and was reported missing. SJSO deputies responded and located Charlie
    struggling to stay afloat in a pond. Deputies rushed in and rescued Charlie, undoubtedly
    saving his life.

    '
