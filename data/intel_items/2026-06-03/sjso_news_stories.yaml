- item_id: SJC-SJSO-20260603-0004
  title: Arrest made in connection to the 2023 double murders of Cody Bennett and
    Tre' Lyons
  summary: 'SJSO arrested Derrick Walden, 43, on two counts of first-degree murder
    for the 2023 shooting deaths of Cody Bennett, 21, and Tre'' Lyons, 22, in West
    Augustine. Walden was already serving a federal sentence on an unrelated firearm
    charge and will be transported to Florida to face the murder charges.

    '
