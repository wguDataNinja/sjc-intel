  resident_relevance:
    summary: 'Free SJSO programs — Project Lifesaver, K9 Scent Kits, and the SAFE
      Program — are available to help families with vulnerable individuals. A rescue
      earlier this year showed how quickly these resources can make a difference in
      an emergency.

      '
    affected_audiences:
    - residents
    - parents
    - retirees
    why_it_matters: 'Families caring for individuals with autism, Alzheimer''s, or
      other conditions that may cause wandering can register for free services that
      help first responders locate them quickly. The programs take only a few minutes
      to join and can save lives.

      '
