- item_id: SJC-SJSO-20260603-0002
  title: Lifesaving rescue highlights the importance of local programs in place to
    locate vulnerable individuals and prevent future emergencies
  summary: 'SJSO deputies rescued an autistic juvenile who wandered from his home
    and was found struggling to stay afloat in a pond. The family subsequently enrolled
    in Project Lifesaver, K9 Scent Kit, and SAFE Program — free SJSO services for
    families with vulnerable individuals.

    '
  source_id: sjso_news_stories
  source_url: https://www.sjso.org/lifesaving-rescue-highlights-the-importance-of-local-programs-in-place-to-locate-vulnerable-individuals-and-prevent-future-emergencies/
