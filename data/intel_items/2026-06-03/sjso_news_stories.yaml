- item_id: SJC-SJSO-20260603-0003
  title: Nine arrested during SJSOs March 2026 DUI Wolfpack Operation
  summary: 'SJSO and partner agencies conducted a countywide DUI Wolfpack Operation
    on March 20-21, 2026, resulting in nine DUI arrests and 173 traffic stops. The
    operation was dedicated to Mark Sabri, who was killed by an impaired driver in
    2024.

    '
