  raw_excerpt: 'Approximately $524,000 in resiliency improvements were completed at
    the Porpoise Point Vehicular Beach Access Ramp in Vilano Beach using a combination
    of state grant funding and Tourist Development Tax funding. The project added
    a newly paved and striped beach access point, upgraded gate and attendant infrastructure,
    and a concrete-encapsulated seawall.

    '
