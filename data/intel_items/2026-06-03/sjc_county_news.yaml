  raw_excerpt: 'The St. Johns River Water Management District (SJRWMD) has issued
    a Phase III Extreme Water Shortage Declaration affecting St. Johns County and
    several other counties across Northeast Florida following prolonged dry conditions
    and declining groundwater levels. The declaration, issued May 11, applies to Clay,
    Duval, Flagler, Nassau, Putnam, and St. Johns counties.

    '
