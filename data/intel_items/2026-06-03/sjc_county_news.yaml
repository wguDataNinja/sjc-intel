- item_id: SJC-CN-20260603-0003
  title: Public Library Announces 2026 Summer Reading Program
  summary: 'The St. Johns County Public Library System announced its "Stars, Stripes,
    and Stories" Summer Reading Program running May 31 through July 25. The program
    features free reading logs with prizes, over 100 events, story times, book clubs,
    and STEM offerings across all six library branches.

    '
