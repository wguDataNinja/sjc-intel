- item_id: SJC-CN-20260603-0004
  title: St. Johns County Earns Statewide Communications Recognition
  summary: 'St. Johns County received the Florida Municipal Communicators Association''s
    Certificate of Excellence in Government Communications and the Outstanding Award
    for Collaborative Marketing Campaign for its Inside SJC video series. This is
    the second consecutive year the County has earned the Certificate of Excellence.

    '
