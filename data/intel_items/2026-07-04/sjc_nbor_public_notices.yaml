  _raw_text: "CPA(SS) 2025000013 Daily´s Place   \r\n\t\t\t\t\t        A request for\
    \ a Small-Scale Comprehensive Plan Amendment to change the Future Land Use Map\
    \ designation of approximately 7.7 acres of land, located at 600 State Road 13\
    \ North, from Residential-B (RES-B) to Community Commercial (CC), with a Site\
    \ Specific Text Amendment limiting commercial uses on the southern portion of\
    \ the subject property to those uses allowed within the Commercial General (CG)\
    \ Zoning District and a maximum 20,000 square feet; limiting uses on the northern\
    \ portion of the subject property to passive uses including a stormwater retention\
    \ system and associated vegetation/green space; a 30’ Scenic Edge provided along\
