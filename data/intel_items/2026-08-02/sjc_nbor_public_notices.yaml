  _raw_text: "NW Sector Community Meeting: CPA(SS)2025-07 & MAJMOD 2025-08 Bartram\
    \ Grove   \r\n\t\t\t\t\t        The requested applications propose to: (1) modify\
    \ the Bartram Park DRI 2001-139 (as amended, 2019-166) to add 42.3 acres+/- located\
    \ on the south side of Race Track Road, between East Peyton Parkway and State\
    \ Road 9B, to the DRI boundary; increase the maximum commercial entitlement to\
    \ 500,000 square feet; and convert 20,000 square feet of commercial entitlements\
    \ to 169 residential dwelling units (DUs), increasing the maximum number of residential\
    \ dwelling units from 646 to 815 with no additional external vehicular trips added;\
    \ (2) modify PUD Ordinance 2017-15 (MAJMOD 2025-08) to rename the development\
    \ to \"Bartram Grove PUD and allow a maximum of 90 single-family DUs, 90 multifamily\
    \ DUs, and 50,000 square feet of commercial and office uses; and (3) revise the\
    \ 2050 Future Land Use Map designation (CPA(SS) 2025-07) of approximately 44.29\
    \ acres +/- from Intensive Commercial (IC) to Mixed Use District (MD) and to amend\
    \ site specific text Policy A.1.11.1(m)(8)(x) to limit the development to a maximum\
    \ of 180 residential DUs (90 single family attached & 90 single family detached),\
    \ along with 50,000 square feet of retail/commercial and office uses on the subject\
    \ property. Proposed access to the subject property will be provided via Race\
    \ Track Road.   PROPOSED SITE LOCATION   \r\n                             \r\n\
