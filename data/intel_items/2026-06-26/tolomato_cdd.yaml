    title: "Tolomato CDD FY2026 Assessment Information Published"
    source_created_at: ~
    extracted_at: "2026-06-26T12:22:59Z"
    content: >
      Fiscal Year 2026 annual assessment schedules for Tolomato Community
      Development District have been published. The assessments are paid as part
      of the County Property Tax bill received in November 2025 (for CDD FY
      beginning October 1, 2025, ending September 30, 2026). The total assessment
      includes Debt (bond payments for district infrastructure) and Operations &
      Maintenance (landscape maintenance and amenities). Assessment lookup is
      available via the county property appraiser. Estoppel letters available
      from joy@nocatee.com ($250 fee).
