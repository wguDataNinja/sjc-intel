  - item_id: "six_mile_creek_cdd-002"
    source_id: "six_mile_creek_cdd"
    source_item_url: "https://sixmilecreekcdd.com/"
    title: "Notice of Qualifying Period for Six Mile Creek CDD Board Candidates — Seats 2 and 4"
    source_created_at: "2026-06-12T22:45:50Z"
    extracted_at: "2026-06-26T12:22:59Z"
    content: >
      Notice is hereby given that the qualifying period for candidates for the
      office of Supervisor of the Six Mile Creek Community Development District
      commenced at noon on June 8, 2026 and closed at noon on June 12, 2026.
      Two seats (Seats 2 and 4) are up for election, each with a four-year term.
      Candidates must qualify with the St. Johns County Supervisor of Elections.
      Elections are nonpartisan and will be held concurrently with the general
      election on November 3, 2026.
