    title: "Six Mile Creek CDD Board of Supervisors Vacancy Announcement"
    source_created_at: "2026-06-12T22:45:50Z"
    extracted_at: "2026-06-26T12:22:59Z"
    content: >
      The Six Mile Creek Community Development District Board of Supervisors is
      accepting applications from individuals interested in filling a vacant CDD
      Board seat. Candidates must be registered voters residing in Six Mile Creek
      CDD. Letters of interest or résumés must be submitted via email to
      ssweeting@gmsnf.com no later than noon on June 30, 2026. The Board will
      review applications and make a selection by majority vote at the next CDD
      meeting on July 8, 2026. The appointee must file a Statement of Financial
      Disclosure (Form 1) within 30 days.
