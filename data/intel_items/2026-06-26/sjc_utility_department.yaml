  title: SJC Utilities 2025 Annual Report Published
  summary: 'The St. Johns County Utilities Department published its 2025 Annual Report, highlighting fiscal responsibility, reliable service delivery, environmental stewardship, and long-term infrastructure planning. Key 2025 projects include Hastings Water Treatment Plant improvements, Northwest Water Reclamation Facility expansion, wellfield expansion projects, and wastewater process upgrades on State Road 16. The report notes residential utility bills remain approximately 10 percent below the regional average.'
