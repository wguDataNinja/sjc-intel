  - item_id: "SJC-SL-20260807-0003"
    title: "First Coast Expressway — St. Johns County final phase and I-95 access"
    summary: "FDOT's First Coast Expressway (SR 23) is being built in segments; the remaining St. Johns County work reached the public-hearing stage in January 2026 and FDOT targets full completion by 2030. When complete, the toll expressway gives northwestern St. Johns County, including SilverLeaf, a new north-south alternative to I-95, and construction has required temporary St. Johns Parkway detours. Status as of early August 2026: final-phase work underway."
