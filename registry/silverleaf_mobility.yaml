# =============================================================================
# SJC_Intel — SilverLeaf Mobility Scope Registry
# =============================================================================
# Defines the source-backed road segments and notice-selection rules relevant to
# SilverLeaf residents. This is an editorial monitoring scope, not a routing
# engine, GIS network, access-rights determination, or live traffic feed.
# =============================================================================

