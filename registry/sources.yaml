# =============================================================================
# SJC_Intel — Source Registry
# =============================================================================
# Master list of all discovered and configured public information sources for
# St. Johns County, Florida.
#
# Each record follows the schema defined in schemas/source.schema.yaml.
# Fields marked (future) are placeholders for monitor configuration data
# that will be populated when monitoring tasks are created.
#
# Schema version: 1.0
# Last updated: 2026-06-03
# Updated by: sjc-intel-architect
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # Priority 1 — High Relevance, Daily Monitoring
  # ---------------------------------------------------------------------------

  - source_id: "sjc_county_news"
    name: "SJC County News"
    description: >
      Official St. Johns County government press releases, announcements,
      project updates, and public notices. Published via the county's
      WordPress site.
    url: "https://www.sjcfl.us/news/"
    base_domain: "sjcfl.us"
    source_type: "wordpress_blog"
    relevance: "HIGH"
    monitor_frequency: "daily"
    automatable: "YES"
    status: "active"
    topics:
      - county_government
      - public_notices
      - development
      - community_events
      - emergency_alerts
    communities: []
    notes: >
      WordPress blog listing. No RSS feed. HTML parsing of
      /news/ page works. Individual article URLs follow WP permalink pattern.
      Pilot completed 2026-06-03 — 5 items extracted successfully.
      Main page only shows 4 Featured News items; sidebar on article pages
      shows additional recent items.
    monitor_config:
      check_url: "https://www.sjcfl.us/news/"
      check_interval_hours: 24
      extract_selector: ".news_sec_row, .news_sec_bk"
      item_url_pattern: "https://www.sjcfl.us/{slug}/"
      last_checked: "2026-06-03T04:00:00Z"
      last_error: ~
    discovered_at: "2026-06-03T12:00:00Z"
    discovered_by: "hermes-discovery-worker"
    updated_at: "2026-06-03T04:30:00Z"
    updated_by: "sjc-intel-architect (pilot)"

  - source_id: "sjso_news_stories"
    name: "SJSO News Stories"
    description: >
      St. Johns County Sheriff's Office press releases, arrest reports,
      incident alerts, and community safety information. Primary source for
      law enforcement intelligence.
    url: "https://www.sjso.org/news-stories/"
    base_domain: "sjso.org"
    source_type: "wordpress_blog"
    relevance: "HIGH"
    monitor_frequency: "daily"
    automatable: "YES"
    status: "active"
    topics:
      - public_safety
      - crime
      - arrests
      - incidents
      - press_releases
    communities: []
    notes: >
      WordPress / Elementor blog. News story URLs follow slug pattern.
      Pilot completed 2026-06-03 — 4 items extracted with full
      resident-interest classification. Default sensitivity: medium for
      public-safety items. CMS may generate Unicode-encoded URLs for
      certain article titles — handle gracefully.
    monitor_config:
      check_url: "https://www.sjso.org/news-stories/"
      check_interval_hours: 24
      extract_selector: ".elementor-posts-container .elementor-post"
      item_url_pattern: "https://www.sjso.org/{slug}/"
      last_checked: "2026-06-03T06:00:00Z"
      last_error: ~
    discovered_at: "2026-06-03T12:00:00Z"
    discovered_by: "hermes-discovery-worker"
    updated_at: "2026-06-03T06:30:00Z"
    updated_by: "sjc-intel-architect (pilot)"

  - source_id: "sjso_social_media"
    name: "SJSO Social Media"
    description: >
      Sheriff's Office public social media channels — X/Twitter (@SJSOPIO),
      Facebook (/StJohnsSheriffOffice/), Instagram (@sjsopio). Rapid public
      safety alerts, incident notifications, community engagement.
    url: "https://x.com/SJSOPIO"
    base_domain: "x.com"
    source_type: "social_media"
    relevance: "HIGH"
    monitor_frequency: "realtime"
    automatable: "YES"
    status: "verified"
    topics:
      - public_safety
      - incidents
      - alerts
      - community_engagement
    communities: []
    notes: >
      X/Twitter via @SJSOPIO is the fastest alert channel. Facebook and
      Instagram for community engagement. Social media is discovery-only;
      content is treated as leads, not verified fact.
    discovered_at: "2026-06-03T12:00:00Z"
    discovered_by: "hermes-discovery-worker"

