# -----------------------------------------------------------------------------
# Relevance rules (direct / nearby / countywide-material)
# -----------------------------------------------------------------------------
relevance:
  direct:
    - id: in_silverleaf
      label: "In SilverLeaf"
      rule: >
        Item is inside SilverLeaf or a registered SilverLeaf neighborhood, or
        directly affects a SilverLeaf school, development, business, service,
        or access road (SilverLeaf Parkway, CR 16A, CR 2209 connector, IGP).
      verification: editorial-policy
  nearby:
    - id: near_silverleaf
      label: "Near SilverLeaf"
      rule: >
        Item affects a materially adjacent corridor (CR 210, SR 16, US 1) or
        an adjacent commercial/health center that SilverLeaf residents use,
        without being inside the community.
      verification: editorial-policy
  countywide_material:
    - id: countywide_impact
      label: "Countywide impact"
      rule: >
        Countywide item may be published only when it materially affects
        SilverLeaf residents: utility service continuity, water restrictions,
        countywide tax/land decisions that change local conditions, or
        public-safety conditions. Pure civic items (auctions, library promos,
        awards) are excluded by default.
      verification: editorial-policy

# -----------------------------------------------------------------------------
# Inclusion / exclusion rules
# -----------------------------------------------------------------------------
inclusion_rules:
  - id: INC-01
    rule: "Item is inside the SilverLeaf boundary or a registered SilverLeaf neighborhood."
    verification: editorial-policy
  - id: INC-02
    rule: "Item affects a school serving SilverLeaf (SilverLeaf K-8; Tocoi Creek HS while inferred)."
    verification: editorial-policy
  - id: INC-03
    rule: "Item affects a major access/commute route (SilverLeaf Parkway, CR 16A, St. Johns Parkway/CR 2209, CR 210, SR 16, IGP)."
    verification: editorial-policy
  - id: INC-04
    rule: "Item changes nearby shopping, healthcare, parks, or services that SilverLeaf residents use."
    verification: editorial-policy
  - id: INC-05
    rule: "Item affects taxes, utilities, zoning, or emergency conditions for SilverLeaf residents."
    verification: editorial-policy
  - id: INC-06
    rule: "Notable local achievement involving SilverLeaf residents."
    verification: editorial-policy

exclusion_rules:
  - id: EXC-01
    rule: "Somewhere in St. Johns County is NOT sufficient (product-direction rule, 2026-07-06)."
    verification: editorial-policy
  - id: EXC-02
    rule: "Nocatee-only items (crossover only for corridor/shared infrastructure)."
    verification: editorial-policy
  - id: EXC-03
    rule: "RiverTown-only items."
    verification: editorial-policy
  - id: EXC-04
    rule: "Beachwalk-only items unless CR 210 impact."
    verification: editorial-policy
  - id: EXC-05
    rule: "Countywide items with no SilverLeaf household/commute/school impact."
    verification: editorial-policy
  - id: EXC-06
    rule: "Crime/public-safety items unless explicit editorial approval."
    verification: editorial-policy
  - id: EXC-07
    rule: "Items whose relevance depends on unverified local-media claims."
    verification: editorial-policy

