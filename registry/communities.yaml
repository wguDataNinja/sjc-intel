    status: "active"

  - id: "cherry_elm"
    name: "Cherry Elm"
    type: "neighborhood"
    parent_area: "silverleaf"
    notes: >
      Neighborhood within the SilverLeaf master-planned community in
      northwestern St. Johns County. Mentioned by resident as area of
      specific interest. May overlap with one of the directory-confirmed
