  # -------------------------------------------------------------------------
  # 1. Water shortage (countywide impact)
  # -------------------------------------------------------------------------
  - public_item_id: "DEMO-SL-20260804-0001"
    title: "Phase III Water Shortage Continues Across St. Johns County"
    summary: >
      The St. Johns River Water Management District's Phase III Extreme Water
      Shortage order remains in effect, limiting when lawns can be irrigated.
    why_it_matters: >
      SilverLeaf households on county water follow the irrigation schedule.
      Fines apply for watering on non-permitted days.
    source_name: "St. Johns County Utility Department"
    source_url: "https://www.sjcfl.us/departments/utility-department/"
    source_date: "2026-07-28"
    published_date: "2026-08-04"
    relevance: "countywide_impact"
    topic_ids: ["water_restrictions", "environment"]
    entity_ids: []
    place_ids: []
    sensitivity_display: "none"
    verification_display: "Confirmed from source"

  # -------------------------------------------------------------------------
  # 2. School construction (in SilverLeaf)
  # -------------------------------------------------------------------------
  - public_item_id: "DEMO-SL-20260804-0002"
    title: "SilverLeaf K-8 School On Track for Fall Opening"
    summary: >
      The new K-8 school in SilverLeaf is expected to open for the 2026-2027
      school year, adding roughly 1,500 seats for area students.
    why_it_matters: >
      A new school can change attendance zones and ease crowding at nearby
      campuses, and brings more car traffic near SilverLeaf Parkway.
    source_name: "SJC School District"
    source_url: "https://www.stjohns.k12.fl.us/"
    source_date: "2026-07-22"
    published_date: "2026-08-04"
    relevance: "in_silverleaf"
    topic_ids: ["education", "development"]
    entity_ids: ["ENT-EDU-SILVERLEAF-K8"]
    place_ids: ["silverleaf"]
    lifecycle: "under_construction"
    lifecycle_label: "Under construction"
    sensitivity_display: "none"
    verification_display: "Confirmed from source"

  # -------------------------------------------------------------------------
  # 3. CR 2209 connector (in SilverLeaf / near)
  # -------------------------------------------------------------------------
  - public_item_id: "DEMO-SL-20260804-0003"
    title: "CR 2209 Connector Opens Direct Route to International Golf Parkway"
    summary: >
      The connector between SilverLeaf Parkway and International Golf Parkway
      opened and shortens trips toward the county's northern commercial areas.
    why_it_matters: >
      SilverLeaf drivers now have a direct route to International Golf
      Parkway, reducing dependence on CR 210 for some trips.
    source_name: "SJC County News"
    source_url: "https://www.sjcfl.us/news/"
    source_date: "2025-10-28"
    published_date: "2026-08-04"
    relevance: "in_silverleaf"
