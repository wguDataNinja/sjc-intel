    title: "Harris Teeter Proposed for SilverLeaf Shopping Center"
    summary: >
      A Harris Teeter supermarket is proposed for a SilverLeaf shopping
      center, which would give the area a second major grocery option.
    why_it_matters: >
      More grocery competition in SilverLeaf may improve selection and
      prices; construction has not started and timing is not confirmed.
