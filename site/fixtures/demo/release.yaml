  # -------------------------------------------------------------------------
  # 5. Local retail opening (in SilverLeaf)
  # -------------------------------------------------------------------------
  - public_item_id: "DEMO-SL-20260804-0005"
    title: "SilverLeaf Publix Marks First Big Grocery Anchor in Community"
    summary: >
      The large Publix at 1975 SilverLeaf Parkway is now open, giving the
      community a full-service grocery anchor with pharmacy and prepared food.
    why_it_matters: >
      A full-service grocery inside SilverLeaf shortens everyday errands for
      residents and signals continued retail growth in the community.
    source_name: "St. Johns Citizen"
    source_url: "https://sjcitizen.com/"
    source_date: "2026-03-26"
