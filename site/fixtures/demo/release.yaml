  # -------------------------------------------------------------------------
  - public_item_id: "DEMO-SL-20260804-0006"
    title: "Railroad Crossing Maintenance to Temporarily Close West King Street and Kinlaw Road"
    summary: >
      Scheduled crossing work will temporarily close West King Street and
      Kinlaw Road while crews maintain the railroad crossings.
    why_it_matters: >
      These crossings sit on routes some SilverLeaf residents use to reach
      western St. Johns County; plan extra time or an alternate route.
    source_name: "SJC County News"
    source_url: "https://www.sjcfl.us/news/"
