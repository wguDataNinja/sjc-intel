    sensitivity_display: "none"
    verification_display: "Confirmed from source"

  # -------------------------------------------------------------------------
  # 4. Development hearing (near SilverLeaf, explicit hearing date)
  # -------------------------------------------------------------------------
  - public_item_id: "DEMO-SL-20260804-0004"
    title: "Public Hearing Set for Retail Center Near CR 210"
    summary: >
      A proposed shopping center on the CR 210 corridor will go before the
      county's planning board for a public hearing this fall.
    why_it_matters: >
      The project could bring new stores and added traffic near a corridor
      SilverLeaf residents use for groceries and commuting.
    source_name: "SJC Neighborhood Board of Review"
    source_url: "https://webapp.sjcfl.us/webnews/NBRscreend.aspx"
    source_date: "2026-07-30"
