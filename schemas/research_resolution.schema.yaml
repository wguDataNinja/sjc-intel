schema_version: "1.0"
title: Research-resolution record for ambiguous adaptive proposals
description: >-
  Output of bounded follow-up research that must precede human review when a
  proposal has identity uncertainty, geographic conflict, stale evidence,
  conflicting sources, or material resident importance. Generated by a bounded
  research stage; reviewed by the independent evaluator; never self-evaluated
  by the strategist.
required:
  - proposal_id
  - subject
  - research_trigger
  - questions_to_resolve
  - queries_run
  - sources_checked
  - confirmed_facts
  - strong_inferences
  - conflicting_evidence
  - unresolved_questions
  - recommended_canonical_name
  - recommended_aliases
  - recommended_state
  - recommended_action
  - confidence
  - next_search_date
properties:
  research_trigger:
    type: object
    description: Map of trigger category to reasons; empty categories omitted.
  recommended_action:
    enum: [ACCEPT, ACCEPT_QUALIFIED, DEFER, REJECT, RESEARCH_AGAIN]
  confidence:
    type: number
    minimum: 0
    maximum: 1
  queries_run:
    type: array
    items:
      type: string
    min_items: 1
  recommended_aliases:
    type: array
    items:
      type: string
  next_search_date:
    type: string
    description: ISO date for the next recurring search, or null when closed.
