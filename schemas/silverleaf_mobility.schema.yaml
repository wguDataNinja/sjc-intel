# Field-level contract for registry/silverleaf_mobility.yaml.

schema_version: {type: string, required: true}
status: {type: enum, allowed: [active, proposed, superseded]}
last_updated: {type: string (ISO 8601), required: true}

authority_sources:
  type: array
  required: true
  items:
    fields:
      id: {type: string, required: true}
      authority: {type: string, required: true}
      source_url: {type: URL, required: true}
      source_type: {type: enum, allowed: [official_county_project_record, official_state_project_record]}
      retrieved_on: {type: string (ISO 8601), required: true}

segments:
  type: array
  required: true
  items:
    fields:
      id: {type: string, required: true}
      relationship: {type: enum, allowed: [direct_access, direct_connection_interface, nearby_commute_corridor, contextual_only]}
      endpoints: {type: object, required: true}
      source_ids: {type: array, required: true}
      monitor_sources: {type: array, required: true}
      selection_rule: {type: string, required: true}
      exclusions: {type: array, required: true}

unknown_or_unverified:
  type: array
  required: true
  description: Explicitly records mobility areas that must not be inferred.
